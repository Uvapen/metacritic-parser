<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metacritic Parser{% endblock %}</title>
  <style>
    :root {
      --bg: #0e1116;
      --bg-elev: #171b22;
      --bg-hover: #1f2530;
      --line: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #00ce7a;
      --mixed: #ffcc33;
      --bad: #ff6874;
      --link: #7ad3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.card,
    a.card:hover {
      color: inherit;
      text-decoration: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem clamp(0.9rem, 2.2vw, 2rem);
      border-bottom: 1px solid var(--line);
      background: #12161d;
      position: sticky;
      top: 0;
    }
    .brand {
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand span { color: var(--accent); }
    nav { display: flex; gap: 1rem; }
    nav a { color: var(--muted); }
    nav a.active, nav a:hover { color: var(--text); text-decoration: none; }
    main {
      width: min(100%, 1680px);
      margin: 0 auto;
      padding: 1.25rem clamp(0.9rem, 2.2vw, 2rem);
    }
    h1, h2, h3 { margin: 0 0 0.7rem; font-weight: 650; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .card {
      position: relative;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .card:hover { background: var(--bg-hover); }
    .card-badge {
      position: absolute;
      top: 0.55rem;
      left: 0.55rem;
      z-index: 1;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }
    .cover-box {
      aspect-ratio: 3 / 2;
      background: #0d1117;
      overflow: hidden;
      border-radius: 8px;
    }
    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 0.9rem;
    }
    .card .body, .panel { padding: 0.9rem 1rem; }
    .game-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.75em;
      line-height: 1.375;
    }
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 1rem;
    }
    .media-block {
      margin: 0 0 1.6rem;
    }
    .score {
      display: inline-flex;
      min-width: 2.1rem;
      justify-content: center;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-weight: 700;
      color: #08110c;
    }
    .score.good { background: var(--accent); }
    .score.mixed { background: var(--mixed); }
    .score.bad { background: var(--bad); color: #1b0a0c; }
    .score.empty { background: #2a3140; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    .table-wrap { overflow-x: auto; }
    table.llm-calls th,
    table.llm-calls td { white-space: nowrap; }
    table.llm-calls td.wrap { white-space: normal; }
    table.llm-calls .col-run { white-space: nowrap; }
    th, td { text-align: left; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #062616;
      border: 0;
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #2a3140;
      color: var(--muted);
    }
    .pill.success, .pill.new, .pill.updated { background: #123d2c; color: var(--accent); }
    .pill.partial { background: #3d3412; color: var(--mixed); }
    .pill.error { background: #3d151b; color: var(--bad); }
    .pill.running { background: #3d3412; color: var(--mixed); }
    .pill.retry { background: #3d3412; color: var(--mixed); }
    .pill.skipped { background: #2a3140; color: var(--muted); }
    .pill.carousel { background: #123d2c; color: var(--accent); }
    .similar-reasons,
    .similar-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
      margin-top: 0.5rem;
    }
    .similar-tags .pill.reason {
      font-size: 0.72rem;
      line-height: 1.35;
      padding: 0.12rem 0.5rem;
      max-width: 100%;
    }
    .similar-meta {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .similar-scoreline {
      margin-top: 0.55rem;
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 0.7rem;
      align-items: flex-end;
      margin: 0 0 1rem;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      flex: 1 1 7.2rem;
      min-width: 7.2rem;
    }
    #llm-filters,
    #runs-filters,
    #games-filters {
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .filters .btn {
      flex: 0 0 auto;
      align-self: flex-end;
    }
    .filters input, .filters select {
      background: #10141a;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.55rem;
      font: inherit;
      min-width: 0;
      width: 100%;
    }
    .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin: 0.8rem 0 0;
      font-size: 0.9rem;
    }
    .pager .off { color: var(--muted); }
    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin: 0.9rem 0 0;
      font-size: 0.9rem;
    }
    .pagination a,
    .pagination span {
      min-width: 2rem;
      text-align: center;
      padding: 0.25rem 0.45rem;
      border-radius: 6px;
    }
    .pagination .current {
      background: var(--accent);
      color: #062616;
      font-weight: 700;
    }
    .pagination .off,
    .pagination .ellipsis { color: var(--muted); }
    .error-n { color: var(--bad); font-weight: 700; }
    .highlight-row { outline: 2px solid var(--accent); }
    tr[id^="game-"],
    tr[id^="llm-"] { scroll-margin-top: 4.5rem; }
    .status-reason {
      margin-top: 0.25rem;
      font-size: 0.82em;
      max-width: 22rem;
      line-height: 1.35;
    }
    .changes-box summary { cursor: pointer; }
    .changes-box .changes { margin-top: 0.45rem; }
    .crumbs { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .run-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .inline-check {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .inline-check input { accent-color: var(--accent); }
    .changes {
      margin: 0;
      padding-left: 1.1rem;
    }
    .dialog-block pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #10141a;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      overflow: auto;
      max-height: 28rem;
      font-size: 0.85rem;
    }
    .cover-row { display: flex; gap: 1.2rem; align-items: flex-start; }
    .fact {
      margin: 0.7rem 0 0;
    }
    .fact-label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .fact-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .fact-list {
      margin: 0;
      padding-left: 1.15rem;
      color: var(--text);
    }
    .fact-list li {
      margin: 0.2rem 0;
      line-height: 1.35;
    }
    .fact-text {
      margin: 0;
      color: var(--text);
      line-height: 1.4;
    }
    .summaries-grid .panel > p:first-of-type,
    .media-card .body > p:not(.muted),
    .game-blurb {
      text-align: justify;
      hyphens: auto;
    }
    .cover-row > .cover-box {
      width: 320px;
      max-width: 100%;
      flex-shrink: 0;
    }
    .summaries-grid,
    .media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: start;
    }
    .summaries-grid .panel { margin-bottom: 0; }
    .media-card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      padding: 0;
    }
    .media-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #10141a;
      overflow: hidden;
      border: 0;
      padding: 0;
      width: 100%;
      display: block;
      cursor: pointer;
      color: inherit;
    }
    .media-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-thumb .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      font-size: 2.2rem;
      pointer-events: none;
    }
    .media-card .body { padding: 0.8rem 1rem 1rem; }
    .media-placeholder {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10141a;
      color: var(--muted);
      text-align: center;
      padding: 1rem;
    }
    .media-modal {
      border: 0;
      padding: 0;
      background: #000;
      width: min(960px, 96vw);
      max-width: 96vw;
    }
    .media-modal::backdrop { background: rgba(0, 0, 0, 0.72); }
    .media-modal-close {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      z-index: 2;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 0;
      border-radius: 999px;
      width: 2rem;
      height: 2rem;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .media-modal-frame {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .media-modal-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .review {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--line);
    }
    .review-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .review-extra.hidden,
    .rev-short.hidden,
    .rev-full.hidden { display: none; }
    .review p { margin: 0.35rem 0 0; }
    .review-toggle {
      margin-top: 0.7rem;
      background: transparent;
      color: var(--link);
      border: 0;
      padding: 0;
      cursor: pointer;
      font: inherit;
    }
    .run-details {
      margin: 0.4rem 0 0;
      padding-left: 1.1rem;
      font-size: 0.85rem;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: 0.85rem;
    }
    .video-container {
      margin-top: 0.8rem;
      margin-bottom: 1.5rem;
      border-radius: 10px;
      overflow: hidden;
      background: #10141a;
    }
    @media (max-width: 800px) {
      .cover-row { display: grid; grid-template-columns: 1fr; }
      .cover-row > .cover-box { width: 100%; }
      .summaries-grid, .media-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Metacritic <span>Parser</span></a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Последние</a>
      <a href="/games" {% if request.url.path == '/games' %}class="active"{% endif %}>Все игры</a>
      <a href="/monitor" {% if request.url.path == '/monitor' %}class="active"{% endif %}>Монитор</a>
      <a href="/api/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      const KEY = "scroll_restore";
      const raw = sessionStorage.getItem(KEY);
      const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      const isSection = hashId === "llm-table" || hashId === "runs-table";
      const isRow = Boolean(hashId) && !isSection;

      const highlightRow = (el) => {
        el.classList.add("highlight-row");
        el.scrollIntoView({ block: "center" });
        setTimeout(() => el.classList.remove("highlight-row"), 4000);
      };

      if (isRow) {
        if (raw != null && raw !== "") sessionStorage.removeItem(KEY);
        const go = () => {
          const el = document.getElementById(hashId);
          if (el) highlightRow(el);
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", go);
        } else {
          go();
        }
      } else if (raw != null && raw !== "") {
        sessionStorage.removeItem(KEY);
        const y = Number(raw);
        const restore = () => {
          if (!Number.isNaN(y)) window.scrollTo(0, y);
        };
        restore();
        window.addEventListener("load", restore);
      } else if (isSection) {
        const go = () => document.getElementById(hashId)?.scrollIntoView();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", go);
        } else {
          go();
        }
      }
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        if (link.closest(".pagination") || link.hasAttribute("data-scroll-restore")) {
          sessionStorage.setItem(KEY, String(window.scrollY));
        }
      });

      const submitFilter = (form) => {
        sessionStorage.setItem(KEY, String(window.scrollY));
        const params = new URLSearchParams();
        for (const [key, value] of new FormData(form).entries()) {
          if (String(value).trim() !== "") params.set(key, value);
        }
        const qs = params.toString();
        const hash = form.dataset.anchor || "";
        window.location.href = form.getAttribute("action") + (qs ? "?" + qs : "") + hash;
      };
      document.querySelectorAll("form.filters").forEach((form) => {
        form.querySelectorAll("select, input[type=date]").forEach((el) => {
          el.addEventListener("change", () => submitFilter(form));
        });
        let timer = null;
        form.querySelectorAll("input[type=search], input[type=text]").forEach((el) => {
          el.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(() => submitFilter(form), 400);
          });
        });
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          submitFilter(form);
        });
      });
    })();
  </script>
</body>
</html>
